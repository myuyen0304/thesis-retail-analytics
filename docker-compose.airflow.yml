# Độc lập với PostgreSQL dev; metadata Airflow có database và volume riêng.
x-airflow: &airflow
  build:
    context: .
    dockerfile: deploy/airflow/Dockerfile
  image: retail-airflow:local
  env_file:
    - path: .env.airflow.local
      required: false
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-retail-local-demo-change-before-sharing}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/logs/passwords.json
    RETAIL_AIRFLOW_ADMIN_PASSWORD: ${RETAIL_AIRFLOW_ADMIN_PASSWORD:-admin}
    PYTHONUTF8: '1'
  volumes:
    - ./data:/opt/retail/data:ro
    - ./warehouse/pipeline:/opt/retail/warehouse/pipeline
    - airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-db:
      condition: service_healthy

services:
  airflow-db:
    image: postgres:17
    # Tự lên lại khi Docker khởi động, để lịch 08:00 chạy mà không phải gõ `up`. Không đặt cho airflow-init: nó chạy một
    # lần rồi thoát, unless-stopped sẽ khởi động lại nó mãi. Docker tự khởi động lại thì không chờ depends_on; api /
    # scheduler lên trước DB sẽ lỗi rồi tự thử lại.
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-metadata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U airflow -d airflow']
      interval: 5s
      timeout: 5s
      retries: 20
  airflow-init:
    <<: *airflow
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        python -c "import json, os, pathlib; pathlib.Path('/opt/airflow/logs/passwords.json').write_text(json.dumps({'admin': os.environ['RETAIL_AIRFLOW_ADMIN_PASSWORD']}))"
  airflow-api:
    <<: *airflow
    command: api-server
    restart: unless-stopped
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  airflow-scheduler:
    <<: *airflow
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-metadata:
  airflow-logs:
