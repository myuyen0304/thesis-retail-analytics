# PostgreSQL local làm Data Warehouse dev (docs/dwh_roadmap.md, GĐ 1).
#   docker compose up -d          # bật
#   docker compose down           # tắt, GIỮ dữ liệu (volume pgdata)
#   docker compose down -v        # tắt và XÓA dữ liệu -> chạy lại ingest + dbt build
# Cổng 5433 (không phải 5432) để không đụng Postgres khác nếu máy đã cài.
# Mật khẩu chỉ dùng cho máy cá nhân; đổi được bằng file .env (đã gitignore).
services:
  postgres:
    image: postgres:17
    container_name: retail_dwh
    # Mặc định Docker chỉ cấp 64MB /dev/shm: hash join song song của các test đối soát báo
    # "could not resize shared memory segment ... No space left on device".
    shm_size: 512mb
    environment:
      POSTGRES_DB: ${PG_DATABASE:-retail}
      POSTGRES_USER: ${PG_USER:-retail}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-retail}
    ports:
      - "${PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
