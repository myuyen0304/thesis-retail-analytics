# dbt project: 14 CSV nguồn -> staging -> intermediate -> marts (star schema, docs/star_schema.md §7)
# Cùng một bộ model chạy trên 2 target: duckdb (dev, máy cá nhân) và snowflake (production).
# Chạy từ ROOT repo:
#   .venv/Scripts/dbt.exe build --project-dir retail_dbt --profiles-dir retail_dbt --target duckdb
name: retail_dbt
version: '1.0.0'
profile: retail_dbt

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Nhật ký chạy dbt ghi vào chính kho (schema ops) cho trang Sức khỏe dữ liệu của app. Xem macros/health_log.sql.
on-run-start: ["{{ health_log_setup() }}"]
on-run-end: ["{{ health_log_results(results) }}"]

models:
  retail_dbt:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
    # Tầng phục vụ 5 PS (deck docs/presentations/revenue_performance_problem_statement_updated.pptx):
    # KPI tính sẵn theo quy ước R, đọc từ marts. Power BI đọc schema này.
    reporting:
      +materialized: table
      +schema: reporting

# Tham số nghiệp vụ do PM/BA chốt (không phải dữ liệu nguồn), nạp bằng `dbt seed` / `dbt build`.
seeds:
  retail_dbt:
    +schema: reporting
    ps2_phases:   # 4 giai đoạn PS2, chốt 2026-09-27 (docs/dwh_huong_dan_pm_ba.md §4)
      +column_types:
        phase_code: varchar(1)
        phase_name: varchar(50)
        start_year: integer
        end_year: integer
        trend: varchar(20)
        end_turn_note: varchar(50)
    ps2_direction_rule:   # quy tắc tìm tháng đổi hướng PS2 (ghi chú deck slide 7), 2026-09-28
      +column_types:
        window_months: integer
        is_main_window: boolean
        min_run_months: integer
    driver_rule:   # PS4/PS5: ngưỡng "ΔR gần 0" (ghi chú deck slide 11, 13), dev đề xuất 2026-09-29, chờ BA chốt
      +column_types:
        min_abs_delta_rate: decimal(6,4)

tests:
  retail_dbt:
    +severity: error   # mọi test FAIL đều chặn build — như quality gate của scripts/build/build_gold.py
