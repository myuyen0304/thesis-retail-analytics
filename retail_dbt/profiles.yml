# Không chứa bí mật: thông tin kết nối Databricks đọc từ biến môi trường, nạp từ các file .env.*.local
# đã gitignore (.env.airflow.local cho pipeline, .env.databricks.local cho scripts/databricks/run_dbt.py).
# Repo không có GitHub Actions; chạy tự động bằng Airflow (docs/automation_batch.md).
retail_dbt:
  target: postgres
  outputs:
    postgres:          # dev chính: PostgreSQL local (docker-compose.yml ở root, cổng 5433)
      type: postgres
      host: "{{ env_var('PG_HOST', 'localhost') }}"
      port: "{{ env_var('PG_PORT', '5433') | as_number }}"
      dbname: "{{ env_var('PG_DATABASE', 'retail') }}"
      user: "{{ env_var('PG_USER', 'retail') }}"
      password: "{{ env_var('PG_PASSWORD', 'retail') }}"
      schema: public
      threads: 4
    duckdb:            # dev nhẹ: 1 file, không cần server/Docker
      type: duckdb
      path: "{{ env_var('RETAIL_DUCKDB_BUILD_PATH', 'warehouse/dbt.duckdb') }}"   # tương đối từ root repo, đã gitignore
      threads: 4
    databricks:        # production từ 2026-10-05 (docs/dwh_roadmap.md), Databricks Free; chạy qua pipeline --target databricks
                       # hoặc scripts/databricks/run_dbt.py; cần .venv-databricks (requirements-databricks.txt)
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', '') }}"            # không có https://
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '') }}"  # /sql/1.0/warehouses/<id>
      token: "{{ env_var('DATABRICKS_TOKEN', '') }}"          # token OAuth, không dùng PAT: pipeline lấy bằng writer SP (M2M),
                                                              # run_dbt.py lấy từ profile Databricks CLI
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'retail_lab') }}"
      schema: dbt
      threads: 4
